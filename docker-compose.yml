services:
  postgres:
    image: postgres:16-alpine
    container_name: picorte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-picorte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-picorte_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-picorte}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - picorte_pgdata:/var/lib/postgresql/data
      - ./picorte/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  picorte_pgdata:
